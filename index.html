<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/TabIcon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pauline Mapoy</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      (function () {
        // Light by default; dark only if this visitor switched to it before
        try {
          if (localStorage.getItem("theme-choice") === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
